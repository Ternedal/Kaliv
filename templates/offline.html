<html lang="da">

<body>
  <main>
    <section class="copy" aria-labelledby="offline-title">
      <p class="eyebrow">Local-first / Offline</p>

      <button type="button" onclick="window.location.reload()" data-en="Try the connection again">Prøv forbindelsen igen</button>
    </section>
    <aside class="symbol" aria-label="Kaliv"><img src="assets/kaliv-ankh-640.webp" alt="Kalivs futuristiske ankh-symbol" width="640" height="863" data-en-alt="Kaliv’s futuristic ankh symbol"></aside>
