<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070a" />
  <meta name="robots" content="noindex,follow" />
  <title>404 — ModelRig</title>
  <style>
    :root { color-scheme: dark; --blue: #7da3ff; --line: #29313c; --muted: #9ba5b3; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100svh; display: grid; place-items: center; overflow-x: hidden; background: #05070a; color: #fff; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 77% 42%, rgba(20,87,255,.2), transparent 28%), linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: auto, 4rem 4rem, 4rem 4rem; mask-image: linear-gradient(to bottom, #000, transparent 86%); }
    main { position: relative; width: min(70rem, calc(100% - 2.5rem)); min-height: min(45rem, calc(100svh - 2.5rem)); display: grid; grid-template-columns: minmax(0,1.2fr) minmax(16rem,.8fr); border: 1px solid var(--line); background: rgba(5,7,10,.9); box-shadow: 0 2rem 7rem rgba(0,0,0,.5); }
    .copy { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(2rem,6vw,5rem); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: .85rem; font-weight: 750; letter-spacing: -.03em; }
    .mark { display: grid; place-items: center; width: 2.35rem; aspect-ratio: 1; border: 1px solid #fff; font: 700 .72rem ui-monospace, monospace; }
    .eyebrow { margin: 4rem 0 1.5rem; color: var(--blue); font: 650 .75rem ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; }
    h1 { max-width: 8ch; margin: 0 0 1.5rem; font-size: clamp(3.4rem,8vw,7.5rem); line-height: .9; letter-spacing: -.07em; }
    p { max-width: 36rem; margin: 0; color: var(--muted); font-size: clamp(1rem,1.6vw,1.2rem); line-height: 1.6; }
    a { width: fit-content; min-height: 3.25rem; display: inline-flex; align-items: center; margin-top: 2.5rem; padding: .75rem 1rem; border: 1px solid var(--blue); background: #1457ff; color: #fff; font: 700 .75rem ui-monospace, monospace; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    a::after { content: "→"; margin-left: 1rem; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .symbol { display: grid; place-items: center; padding: clamp(2rem,5vw,4rem); overflow: hidden; }
    .symbol img { width: min(100%,18rem); height: auto; filter: drop-shadow(0 0 38px rgba(20,87,255,.48)); }
    .code { align-self: end; color: #697483; font: 650 .72rem ui-monospace, monospace; letter-spacing: .07em; text-transform: uppercase; }
    @media (max-width: 720px) { main { min-height: calc(100svh - 1.5rem); grid-template-columns: 1fr; } .copy { border-right: 0; } .symbol { min-height: 18rem; border-top: 1px solid var(--line); } .symbol img { width: 10rem; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div>
        <div class="brand"><span class="mark">MR</span><span>ModelRig</span></div>
        <div class="eyebrow" id="error-label">404 / Ukendt systemsti</div>
        <h1 id="error-title">Den sti findes ikke.</h1>
        <p id="error-copy">ModelRig består. Denne adresse gør ikke. Gå tilbage til projektets hovedoverblik og fortsæt derfra.</p>
        <a href="./" id="error-link">Tilbage til ModelRig</a>
      </div>
      <span class="code">Local-first · Stateful · Auditable</span>
    </section>
    <aside class="symbol" aria-label="Kaliv"><img src="assets/kaliv-ankh-640.webp" alt="Kalivs futuristiske ankh-symbol" width="640" height="863" /></aside>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      document.title = '404 — ModelRig';
      document.querySelector('#error-label').textContent = '404 / Unknown system path';
      document.querySelector('#error-title').textContent = 'That path does not exist.';
      document.querySelector('#error-copy').textContent = 'ModelRig endures. This address does not. Return to the project overview and continue from there.';
      const link = document.querySelector('#error-link');
      link.textContent = 'Return to ModelRig';
      link.href = './?lang=en';
    }
  </script>
</body>
</html>
