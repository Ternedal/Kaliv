name: Release drift

on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
    inputs:
      report_issue:
        description: Opret eller opdatér opgaven ved release-afvigelse
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kaliv-release-drift
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare latest public ModelRig release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ISSUE: ${{ github.event_name == 'schedule' || inputs.report_issue }}
        run: |
          if [ "$REPORT_ISSUE" = "true" ]; then
            python3 tools/check-release.py --write
          else
            python3 tools/check-release.py
          fi
